name: Deploy Backend to AWS Lambda

on:
  push:
    branches:
      - main
      - staging
    paths:
      - 'apps/backend/**'
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: hrms-dhanadurga
  LAMBDA_FUNCTION: dhanadurga-hrms

# Both branches deploy the same function, so never let two runs overwrite each
# other mid-deploy. A newer run waits for the one in flight to finish.
concurrency:
  group: lambda-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # <sha>  immutable, lets any past build be redeployed
          # latest what the Lambda runs right now
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            apps/backend

          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Deploy to Lambda
        run: |
          FN="${{ env.LAMBDA_FUNCTION }}"
          REGION="${{ env.AWS_REGION }}"
          IMAGE="${{ steps.build-image.outputs.image }}"

          echo "Branch   : ${{ github.ref_name }}"
          echo "Commit   : ${{ github.sha }}"
          echo "Function : $FN"
          echo "Image    : $IMAGE"
          echo ""

          if aws lambda get-function --function-name "$FN" --region "$REGION" >/dev/null 2>&1; then
            aws lambda update-function-code \
              --function-name "$FN" \
              --image-uri "$IMAGE" \
              --region "$REGION"

            aws lambda wait function-updated \
              --function-name "$FN" \
              --region "$REGION"

            echo "Deployment complete."
            aws lambda get-function \
              --function-name "$FN" \
              --region "$REGION" \
              --query 'Configuration.[FunctionName,LastModified,State,PackageType]' \
              --output table
          else
            echo "::warning::Lambda '$FN' does not exist yet - image pushed, deploy skipped."
            echo ""
            echo "Create it once from this image, then every push deploys automatically:"
            echo "  $IMAGE"
          fi
